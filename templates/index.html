<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Resume Skill Extractor</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .upload-section {
            text-align: center;
            padding: 25px;
            border: 2px dashed #ccc;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        input[type="file"] {
            margin: 15px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #333;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #555;
        }

        .result {
            margin-top: 30px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .skill-box {
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f8f9fa;
            font-weight: bold;
        }
        .category {
    margin-top: 30px;
}

.category h3 {
    margin-bottom: 15px;
}

.category-skills {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}
.match-container {
    margin-top: 30px;
    padding: 20px;
    background: #f8f9fa;
    border: 1px solid #ddd;
    border-radius: 10px;
    text-align: center;
}

.match-container h2 {
    margin-bottom: 10px;
}

.match-percentage {
    font-size: 32px;
    font-weight: bold;
}
.job-section {
    margin-top: 30px;
    margin-bottom: 30px;
}

.job-section textarea {
    width: 100%;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    resize: vertical;
    box-sizing: border-box;
}

        .resume-text {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        #error {
            color: red;
            text-align: center;
            margin-top: 20px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Resume Skill Extractor</h1>


    <!-- ============================= -->
    <!-- Resume Upload -->
    <!-- ============================= -->

    <div class="upload-section">

        <form id="uploadForm">

            <input
                type="file"
                id="resumeFile"
                name="file"
                accept=".pdf,.docx"
                required
            >

            <br>

            <button type="submit">
                Upload Resume
            </button>

        </form>

        <div id="loading">
            Extracting skills...
        </div>

        <div id="error"></div>

    </div>
<div class="job-section">
    <h2>Job Description</h2>

    <textarea
        id="jobDescription"
        placeholder="Paste the job description here..."
        rows="8"
    ></textarea>
</div>

    <!-- ============================= -->
    <!-- Results -->
    <!-- ============================= -->

    <div
        class="result"
        id="result"
        style="display: none;"
    >

        <h2>Extracted Skills</h2>

        <p>
            <strong>
                Skills found:
                <span id="skillCount">0</span>
            </strong>
        </p>


        <!-- Skills will appear here -->

        <div id="categoriesContainer"></div>
        <div id="matchContainer" class="match-container"></div>


        <h2>Extracted Resume Text</h2>

        <div
            class="resume-text"
            id="resumeText"
        ></div>

    </div>

</div>


<script>

    const form = document.getElementById("uploadForm");

    const fileInput = document.getElementById("resumeFile");

    const jobDescription = document.getElementById("jobDescription");

    const loading = document.getElementById("loading");

    const error = document.getElementById("error");

    const result = document.getElementById("result");

    const skillCount = document.getElementById("skillCount");

    const categoriesContainer =
    document.getElementById("categoriesContainer");

    const matchContainer = document.getElementById("matchContainer");

    const resumeText =
        document.getElementById("resumeText");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();


        // Clear previous results

        error.textContent = "";

        result.style.display = "none";

        categoriesContainer.innerHTML = "";

        resumeText.textContent = "";


        // Check file

        if (!fileInput.files.length) {

            error.textContent =
                "Please select a resume.";

            return;

        }


        // Create form data

       const formData = new FormData();

formData.append(
    "file",
    fileInput.files[0]
);

formData.append(
    "job_description",
    jobDescription.value
);


        // Show loading

        loading.style.display = "block";


        try {

            // Send resume to FastAPI

            const response = await fetch(
                "/upload-resume",
                {
                    method: "POST",
                    body: formData
                }
            );


            const data = await response.json();


            // Handle error

            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Something went wrong."
                );

            }


            // Show skill count

            skillCount.textContent =
                data.skill_count;


            // Display categorized skills

for (const category in data.categories) {

    const categoryDiv =
        document.createElement("div");

    categoryDiv.className =
        "category";


    const categoryTitle =
        document.createElement("h3");

    categoryTitle.textContent =
        category;


    const categorySkills =
        document.createElement("div");

    categorySkills.className =
        "category-skills";


    data.categories[category].forEach(function(skill) {

        const skillBox =
            document.createElement("div");

        skillBox.className =
            "skill-box";

        skillBox.textContent =
            skill;

        categorySkills.appendChild(
            skillBox
        );

    });


    categoryDiv.appendChild(
        categoryTitle
    );

    categoryDiv.appendChild(
        categorySkills
    );

    categoriesContainer.appendChild(
        categoryDiv
    );
}
matchContainer.innerHTML = `
    <h2>Job Match</h2>

    <div class="match-percentage">
        ${data.match_percentage}%
    </div>

    <h3>Matched Skills</h3>

    <p>
        ${
            data.matched_skills.length
                ? data.matched_skills.join(", ")
                : "None"
        }
    </p>

    <h3>Missing Skills</h3>

    <p>
        ${
            data.missing_skills.length
                ? data.missing_skills.join(", ")
                : "None"
        }
    </p>
`;


            // Display extracted resume text

            resumeText.textContent =
                data.text;


            // Show result

            result.style.display = "block";


        } catch (err) {

            error.textContent =
                err.message;

        }


        // Hide loading

        loading.style.display = "none";

    });

</script>


</body>

</html>
